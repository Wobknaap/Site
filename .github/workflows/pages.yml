name: Publiceer website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: GitHub Pages instellen
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Node instellen
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Openbare inhoud controleren
        run: npm run validate:public
      - name: Publieke site bouwen
        run: node scripts/build-pages.mjs
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Sitepakket uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v4
